name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit + API tests (TypeScript)
        run: npm run test:ts
      - name: Engine tests (Python)
        run: npm run test:py
      - name: Production build
        run: npm run build
      - name: Browser end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: No secrets in the browser bundle
        run: |
          if grep -rEl "AIza[0-9A-Za-z_-]{35}|GEMINI_API_KEY|SESSION_SECRET" dist/assets; then echo "secret-like string in bundle"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            test-results
            e2e/screenshots

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trafficlab:ci .
